<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: rgb(255, 208, 229);
      background: linear-gradient(180deg, rgba(255, 208, 229, 1) 0%, rgba(255, 232, 242, 1) 36%, rgba(255, 255, 255, 1) 100%);
      overflow: hidden;
    }

    .floating-hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ff91a4;
      border-radius: 50%;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      #valentineQuestion {
        font-size: 1.5rem;
      }
      #imageDisplay {
        height: 200px;
        width: 90%;
      }
      button {
        font-size: 1rem;
        min-height: 40px;
        min-width: 60px;
        padding: 0.5rem;
      }
    }

    @media (max-width: 480px) {
      #valentineQuestion {
        font-size: 1.25rem;
        text-align: center;
      }
      button {
        font-size: 0.9rem;
        padding: 0.4rem;
        min-width: 50px;
      }
    }
  </style>
</head>
<body class="gradient-background relative">
  <!-- Floating hearts -->
  <div class="floating-hearts" id="floatingHearts"></div>

  <div class="flex items-center justify-center h-screen relative z-10">
    <div class="flex flex-col items-center p-4">
      <img id="imageDisplay" src="./images/image1.gif" alt="Cute kitten with flowers" class="rounded-md h-[300px] w-[300px] sm:w-[200px]" style="object-fit: cover;" />
      <h2 id="valentineQuestion" class="text-4xl font-bold italic text-[#bd1e59] my-4 text-center">Will you be my Valentine?</h2>
      <div class="flex gap-4 pt-[20px] items-center flex-wrap justify-center" id="responseButtons">
        <button id="yesButton"
          class="bounce2 inline-flex items-center justify-center whitespace-nowrap rounded-md text-[20px] font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-green-400 min-h-12 min-w-[75px] px-4 py-2 bg-green-500 text-white transition">
          Yes
        </button>
        <button id="noButton"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-[20px] font-medium transition disabled:pointer-events-none disabled:opacity-50 hover:bg-red-700 h-12 min-w-[75px] w-auto px-4 py-2 bg-red-500 text-white">
          No
        </button>
      </div>
      <button id="resetButton" class="hidden mt-6 px-4 py-2 rounded-md bg-blue-500 text-white hover:bg-blue-600">Reset</button>
    </div>
  </div>

  <script type="module">
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';

    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
    const resetButton = document.getElementById('resetButton');
    const floatingHearts = document.getElementById('floatingHearts');

    let noClickCount = 0;
    let buttonHeight = 48;
    let buttonWidth = 80;
    let fontSize = 20;
    let countdownTimer = null;
    const imagePaths = [
      "./images/image1.gif",
      "./images/image2.gif",
      "./images/image3.gif",
      "./images/image4.gif",
      "./images/image5.gif",
      "./images/image6.gif",
      "./images/image7.gif"
    ];

    const sounds = {
      yes: new Audio('https://www.soundjay.com/button/sounds/button-4.mp3'),
      no: new Audio('https://www.soundjay.com/button/sounds/button-10.mp3'),
      sad: new Audio('https://www.soundjay.com/human/sounds/sad-trombone-2.mp3')
    };

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = `${Math.random() * 100}%`;
      heart.style.animationDuration = `${Math.random() * 2 + 4}s`;
      floatingHearts.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 500);

    noButton.addEventListener('click', function () {
      sounds.no.play();
      if (noClickCount < 5) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount];
        buttonHeight += 35;
        buttonWidth += 35;
        fontSize += 25;
        yesButton.style.height = `${buttonHeight}px`;
        yesButton.style.width = `${buttonWidth}px`;
        yesButton.style.fontSize = `${fontSize}px`;
        if (noClickCount < 6) {
          noButton.textContent = ["No", "FYM NE", "Shte te pipna", "YOU are not getting it tonight", "MALKO BRATLENCE", "NQMASH IZBOR!"][noClickCount];
        }

        if (noClickCount === 5) {
          startCountdown();
        }
      }
    });

    yesButton.addEventListener('click', () => {
      sounds.yes.play();
      imageDisplay.src = './images/image7.gif';
      valentineQuestion.textContent = "YIPEEEE!! :33";
      responseButtons.style.display = 'none';
      confetti();
      resetButton.classList.remove('hidden');
    });

    resetButton.addEventListener('click', () => {
      location.reload();
    });

    function startCountdown() {
      let timeLeft = 10;
      valentineQuestion.textContent = `Reconsider your choice... ${timeLeft}s`;
      countdownTimer = setInterval(() => {
        timeLeft--;
        valentineQuestion.textContent = `Reconsider your choice... ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(countdownTimer);
          valentineQuestion.textContent = "You're so mean :(";
          sounds.sad.play();
          responseButtons.style.display = 'none';
          resetButton.classList.remove('hidden');
        }
      }, 1000);
    }
  </script>
</body>
</html>
